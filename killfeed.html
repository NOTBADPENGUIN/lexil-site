<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>L'EXIL — Style Killfeed</title>
  <link rel="icon" href="/img/logo.png" />
  <link rel="stylesheet" href="/style.css?v=13" />
  <style>
    .kf-page { max-width: 760px; margin: 0 auto; padding: 30px 24px 90px; }
    .back-link { font-family: var(--font-head); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted-2); text-decoration: none; }
    .back-link:hover { color: var(--gold); }
    .kf-head { margin: 24px 0 22px; }
    .kf-head h1 { font-family: var(--font-head); font-size: clamp(30px, 4.4vw, 46px); text-transform: uppercase; margin: 0; line-height: 1; }
    .kf-head p { font-size: 14.5px; line-height: 1.6; color: var(--muted); margin-top: 12px; }
    .loading { text-align: center; padding: 40px; color: var(--muted-3); }
  </style>
</head>
<body>
  <canvas id="fxAsh" aria-hidden="true"></canvas>
  <div class="fx-vignette" aria-hidden="true"></div>
  <div class="fx-scanlines" aria-hidden="true"></div>

  <div class="kf-page">
    <a href="produit.html?id=col-kf" class="back-link">← Retour au produit</a>
    <div class="kf-head">
      <div class="sec-eyebrow">Couleur de nom · Killfeed</div>
      <h1>Ton style dans le killfeed</h1>
      <p>Choisis une option dans chaque liste : couleur de nom, style de slot et animation. Ton choix est enregistré et s'appliquera en jeu. Aperçu en direct ci-dessous.</p>
    </div>
    <div id="kfRoot"><p class="loading">Chargement…</p></div>
  </div>

  <script src="/config.js?v=13"></script>
  <script src="/fx.js?v=13"></script>
  <script src="/kf-chooser.js?v=13"></script>
  <script>window.LEXIL_KF.mount(document.getElementById("kfRoot"));</script>
</body>
</html>
